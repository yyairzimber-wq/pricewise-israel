# Usage (on the server, from the repo root):
#   cp deploy/.env.example deploy/.env   # fill DOMAIN and ANTHROPIC_API_KEY
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - pricewise-data:/data

  # Caddy gets and renews a Let's Encrypt certificate automatically (HTTPS is
  # required for the camera on phones).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  pricewise-data:
  caddy-data:
